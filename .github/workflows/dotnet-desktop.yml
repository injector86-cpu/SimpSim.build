name: Build Windows
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
      - run: dotnet restore SimpSim.NET.sln
      - run: dotnet build SimpSim.NET.sln -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: SimpSim-Release
          path: |
            **/bin/Release/**/*.exe
            **/bin/Release/**/*.dll
            
